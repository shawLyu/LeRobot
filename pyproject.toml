[project]
name = "lerobot-arm-control"
version = "0.2.0"
description = "Dedicated LeRobot SO-101 control, calibration, perception and local simulation system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
hardware = [
    "lerobot[feetech]==0.6.1",
    "torch==2.11.0",
    "torchvision==0.26.0",
]

[dependency-groups]
dev = ["pytest>=8.1,<10", "ruff>=0.14,<1"]

# This lock is for the remote Linux runtime; local pip installations remain portable.
[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
