[project]
name = "lerobot-arm-control"
version = "0.1.0"
description = "Feetech STS3215 arm diagnostics and bounded gripper tests"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lerobot[feetech]==0.6.1",
    "torch==2.11.0",
    "torchvision==0.26.0",
]

[project.optional-dependencies]
simulation = ["mujoco==3.9.0"]

[project.scripts]
arm-control = "arm_control.cli:main"

[dependency-groups]
dev = ["pytest>=8.1,<10", "ruff>=0.14,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arm_control"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
